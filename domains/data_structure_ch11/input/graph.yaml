domain: data_structure_ods_python
primitives:
  compare_operation:
    defines: A primitive compare(a,b) method that returns negative, positive, or zero depending on whether
      a < b, a > b, or a = b.
    tier: 0
  divide_and_conquer:
    defines: An algorithmic strategy that splits a problem into smaller subproblems, solves them recursively,
      and combines their solutions.
    tier: 0
  binary_heap:
    defines: A data structure storing elements in an array such that the smallest value is at the root
      and each parent is no greater than its children, supporting operations like trickle_down.
    tier: 0
concepts:
  comparison_based_sorting:
    defines: A class of sorting algorithms that only compare pairs of elements using compare(a,b) to determine
      their order, without inspecting the elements' internal representation.
    composed_of:
    - compare_operation
    tier: 1
  merging:
    defines: The process of combining two already-sorted arrays into a single sorted array by repeatedly
      selecting the smaller of the two next elements.
    composed_of:
    - compare_operation
    tier: 1
  pivot_partitioning:
    defines: An in-place technique that rearranges an array around a chosen pivot element x so that elements
      less than x, equal to x, and greater than x form contiguous blocks.
    composed_of:
    - compare_operation
    tier: 1
  bottom_up_heap_construction:
    defines: An O(n)-time method for converting an unsorted array into a valid binary heap by calling
      trickle_down on nodes from the last internal node down to the root.
    composed_of:
    - binary_heap
    tier: 1
  stable_sorting:
    defines: A property of a sorting algorithm whereby it preserves the relative order of elements that
      compare as equal.
    composed_of:
    - comparison_based_sorting
    tier: 2
  merge_sort:
    defines: A comparison-based, divide-and-conquer sorting algorithm that recursively sorts two halves
      of an array and merges the sorted halves in O(n log n) time using at most n log n comparisons.
    composed_of:
    - comparison_based_sorting
    - divide_and_conquer
    - merging
    tier: 2
  quicksort:
    defines: A randomized, in-place, divide-and-conquer sorting algorithm that partitions an array around
      a randomly chosen pivot and recursively sorts the partitions, running in O(n log n) expected time.
    composed_of:
    - comparison_based_sorting
    - divide_and_conquer
    - pivot_partitioning
    tier: 2
  heap_sort:
    defines: An in-place, deterministic sorting algorithm that converts an array into a binary heap and
      repeatedly extracts the minimum element, running in O(n log n) time with at most 2n log n + O(n)
      comparisons.
    composed_of:
    - comparison_based_sorting
    - binary_heap
    - bottom_up_heap_construction
    tier: 2
  comparison_tree:
    defines: A rooted binary tree model of a comparison-based sorting algorithm's execution, where internal
      nodes represent comparisons and leaves represent output permutations.
    composed_of:
    - comparison_based_sorting
    tier: 2
  comparison_sorting_lower_bound:
    defines: The theorem that any deterministic or randomized comparison-based sorting algorithm must
      perform at least log(n!) = n log n − O(n) comparisons in the worst case (or expected case), derived
      from the fact that a correct comparison tree needs at least n! leaves.
    composed_of:
    - comparison_tree
    tier: 3
  non_comparison_sorting:
    defines: Sorting algorithms specialized for small integers that use element values as array indices
      rather than pairwise comparisons, allowing them to beat the comparison-based lower bound.
    composed_of:
    - comparison_sorting_lower_bound
    tier: 4
  counting_sort:
    defines: A non-comparison-based, stable sorting algorithm that sorts n integers in the range {0,...,k-1}
      in O(n+k) time by counting occurrences of each value and using running sums as output positions.
    composed_of:
    - non_comparison_sorting
    - stable_sorting
    tier: 5
  radix_sort:
    defines: A non-comparison-based sorting algorithm that sorts w-bit integers by applying multiple passes
      of counting-sort on d-bit digit groups, from least to most significant, running in O((w/d)(n+2^d))
      time.
    composed_of:
    - counting_sort
    - non_comparison_sorting
    tier: 6
applications:
  integer_sorting_via_indexing:
    defines: The application of counting-sort and radix-sort to sort n integers in the range {0,...,n^c−1}
      in O(cn) time by exploiting array indexing rather than comparisons.
    needs:
    - counting_sort
    - radix_sort
    tier: 7
