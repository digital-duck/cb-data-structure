domain: data_structure_ods_python
primitives:
  graph:
    defines: A structure G = (V, E) consisting of a set of vertices V and a set of directed edges E between
      them.
    tier: 0
  vertex_degree:
    defines: The number of edges in E that have a given vertex i as their source, denoted deg(i).
    tier: 0
  queue:
    defines: A first-in-first-out collection used to order the vertices to be visited during traversal.
    tier: 0
  stack:
    defines: A last-in-first-out collection used as an alternative to recursion for controlling traversal
      order.
    tier: 0
concepts:
  adjacency_matrix:
    defines: A representation of an n-vertex graph as an n x n boolean matrix a, where a[i][j] is true
      if and only if (i,j) is an edge, giving O(1) edge queries/updates but O(n) time for in_edges/out_edges
      and O(n^2) space.
    composed_of:
    - graph
    tier: 1
  adjacency_list:
    defines: A vertex-centric representation of a graph as an array adj of lists, where adj[i] contains
      all vertices j such that (i,j) is an edge, giving O(1) add_edge and O(deg(i)) has_edge/remove_edge,
      with O(n+m) space.
    composed_of:
    - graph
    - vertex_degree
    tier: 1
  graph_traversal:
    defines: The general problem of exploring a graph starting from a vertex i to find all vertices reachable
      from i, best supported by an adjacency list representation.
    composed_of:
    - adjacency_list
    tier: 2
  breadth_first_search:
    defines: A traversal algorithm that visits a start vertex's neighbours, then neighbours-of-neighbours,
      and so on, using a queue and a seen array, running in O(n+m) time on an AdjacencyLists.
    composed_of:
    - graph_traversal
    - queue
    tier: 3
  depth_first_search:
    defines: A traversal algorithm that fully explores one branch from a vertex before backtracking, implemented
      recursively or with an explicit stack and a white/grey/black colouring scheme, running in O(n+m)
      time on an AdjacencyLists.
    composed_of:
    - graph_traversal
    - stack
    tier: 3
applications:
  shortest_path_via_bfs:
    defines: An application of breadth-first search that records a predecessor array p so that the shortest
      path from r to any reachable vertex j can be reconstructed by repeated lookups of p.
    needs:
    - breadth_first_search
    tier: 4
  cycle_detection_via_dfs:
    defines: An application of depth-first search that uses vertex colouring to detect that a back edge
      to a currently-grey vertex implies the existence of a cycle.
    needs:
    - depth_first_search
    tier: 4
  matrix_powers_for_paths:
    defines: An application of adjacency matrices where squaring the matrix (via matrix multiplication)
      counts the number of length-two paths between each pair of vertices, forming the basis of all-pairs
      shortest path algorithms using O(log n) multiplications.
    needs:
    - adjacency_matrix
    tier: 2
